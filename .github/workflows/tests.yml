name: CI

on:
  push:
    branches:
      - "**"  # run on every branch
  pull_request:
    branches:
      - "**"  # run on every branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python 3.13 for uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --locked --python 3.13

      - name: Run tests
        run: uv run pytest
