[project]
name = "se04project-sushi-software"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sorters", "common", "visualizer"]

[project.scripts]
visualizer = "visualizer.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
